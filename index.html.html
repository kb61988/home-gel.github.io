<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Оценка недвижимости | Новороссийск & Геленджик</title>
    
    <!-- Для SEO (можно будет раскомментировать, когда купите домен) -->
    <!-- <meta name="description" content="Бесплатная оценка стоимости недвижимости в Новороссийске и Геленджике. Продажа, аренда, расчёт за 2 минуты."> -->
    <meta name="robots" content="noindex, nofollow">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #eef3f8 0%, #d9e6f2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
        }
        
        .container { width: 100%; max-width: 520px; margin: 0 auto; }
        
        .card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(14px);
            border-radius: 32px;
            padding: 1.8rem 1.5rem;
            margin-bottom: 1.2rem;
            box-shadow: 0 20px 35px rgba(0, 20, 30, 0.12), 0 5px 12px rgba(0,0,0,0.04);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }
        
        .text-center { text-align: center; }
        
        h1 {
            font-size: 2.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #0b4f6c, #1e7a9c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.2rem;
        }
        
        .subtitle { color: #2c3e50; font-size: 1rem; font-weight: 500; margin-bottom: 1rem; }
        
        .city-badge {
            background: #f9a826;
            color: white;
            padding: 0.4rem 1.4rem;
            border-radius: 30px;
            display: inline-block;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 8px 14px rgba(249, 168, 38, 0.3);
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 1rem 1.2rem;
            background: #1e7a9c;
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 0.8rem;
            text-decoration: none;
            text-align: center;
            transition: all 0.25s ease;
            box-shadow: 0 6px 14px rgba(30, 122, 156, 0.25);
        }
        
        .btn:hover { background: #146480; transform: translateY(-2px); }
        .btn-outline { background: white; color: #1e7a9c; border: 2px solid #1e7a9c; box-shadow: none; }
        .btn-outline:hover { background: #f0f9ff; border-color: #0b4f6c; }
        .btn-success { background: #2a9d8f; }
        .btn:disabled { opacity: 0.5; pointer-events: none; }
        
        .city-selector {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1.4rem;
            justify-content: center;
        }
        
        .city-btn {
            flex: 1;
            padding: 0.8rem;
            border: 2px solid #dce5ec;
            border-radius: 20px;
            background: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .city-btn.active { background: #1e7a9c; color: white; border-color: #1e7a9c; }
        
        .quiz-option {
            padding: 0.9rem 1.2rem;
            border: 2px solid #e0e7ef;
            border-radius: 18px;
            margin-bottom: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #ffffff;
            font-weight: 500;
            color: #1e293b;
        }
        
        .quiz-option:hover { border-color: #1e7a9c; background: #f6fcff; }
        .quiz-option.selected {
            border-color: #1e7a9c;
            background: #e1f3fb;
            font-weight: 600;
        }
        
        .input-phone {
            width: 100%;
            padding: 1rem 1.2rem;
            border: 2px solid #e0e7ef;
            border-radius: 20px;
            font-size: 1.1rem;
            margin: 1rem 0 1.2rem;
            background: white;
            outline: none;
        }
        
        .input-phone:focus { border-color: #1e7a9c; box-shadow: 0 0 0 3px rgba(30,122,156,0.2); }
        
        .progress-bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 20px;
            margin: 0.7rem 0 1.3rem;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1e7a9c, #2a9d8f);
            border-radius: 20px;
            transition: width 0.35s ease;
        }
        
        .checklist {
            background: #f0fdf7;
            border: 1px solid #b7e4cf;
            border-radius: 20px;
            padding: 1.2rem;
            margin: 1.2rem 0;
            text-align: left;
        }
        
        .checklist h4 { color: #0f4c3a; margin-bottom: 0.8rem; font-size: 1.1rem; }
        .checklist ul { list-style: none; padding: 0; }
        .checklist li {
            padding: 0.5rem 0;
            border-bottom: 1px dashed #c0e0d0;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }
        .checklist li:last-child { border-bottom: none; }
        
        .data-output {
            background: #f4f9fc;
            border: 1px solid #cbdbe9;
            border-radius: 18px;
            padding: 1rem 1.2rem;
            margin: 1.2rem 0;
            font-size: 0.9rem;
        }
        
        .bonus {
            background: #fff7e0;
            padding: 1rem;
            border-radius: 18px;
            margin: 1.2rem 0;
            font-weight: 500;
            border: 1px solid #ffe5b9;
        }
        
        .small-link {
            font-size: 0.8rem;
            color: #1e7a9c;
            text-decoration: underline;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0.5rem;
        }
        
        @media (max-width: 480px) {
            .card { padding: 1.2rem; }
            h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card text-center">
            <h1>📊 Оценка недвижимости</h1>
            <p class="subtitle">Продажа · Аренда · Быстрый расчёт</p>
            <div class="city-badge" id="currentCityBadge">🏙️ Выберите город</div>
        </div>

        <!-- ШАГ 1: Выбор города и действия -->
        <div id="step1" class="card">
            <div class="city-selector">
                <button class="city-btn" id="cityNovoros">🌊 Новороссийск</button>
                <button class="city-btn" id="cityGelendzhik">🏖️ Геленджик</button>
            </div>
            <button class="btn" id="btnSell" disabled>🏠 Хочу продать квартиру</button>
            <button class="btn btn-outline" id="btnRentOut" disabled>🔑 Хочу сдать квартиру</button>
            <button class="btn btn-outline" id="btnRentIn" disabled>🏢 Хочу арендовать</button>
            <p style="font-size:0.8rem; color:#5f6b7a; margin-top:0.6rem; text-align:center;">👆 Сначала выберите город</p>
        </div>

        <!-- ШАГ 2: Квиз (динамически заполняется) -->
        <div id="step2" class="card" style="display:none;">
            <div id="quizContent"></div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ⚙️ КОНФИГУРАЦИЯ
            // ВАЖНО: для получения заявок на почту или в Telegram нужно настроить бесплатный сервис
            // Рекомендую: https://formsubmit.co (бесплатно до 100 заявок/месяц)
            // Вставьте ваш email вместо example@mail.ru:
            const FORM_ACTION_URL = 'https://formsubmit.co/your-email@example.com';
            
            // ИЛИ для Telegram (раскомментируйте и настройте):
            // 1. Напишите @BotFather в Telegram, создайте бота, получите токен
            // 2. Напишите @userinfobot, получите ваш chat_id
            // 3. Раскомментируйте строку ниже и подставьте токен и chat_id:
            // const TELEGRAM_API = 'https://api.telegram.org/bot7123456789:AAxxxxxxxxxxxxxx/sendMessage';
            // const TELEGRAM_CHAT_ID = '123456789';

            // ===== СОСТОЯНИЕ ПРИЛОЖЕНИЯ =====
            const state = {
                currentCity: null,
                currentAction: null,
                currentStep: 0,
                answers: [],
                phoneNumber: '',
                isSubmitting: false
            };

            // ===== DOM ЭЛЕМЕНТЫ =====
            const DOM = {
                step1: document.getElementById('step1'),
                step2: document.getElementById('step2'),
                quizContent: document.getElementById('quizContent'),
                cityNovoros: document.getElementById('cityNovoros'),
                cityGelendzhik: document.getElementById('cityGelendzhik'),
                currentCityBadge: document.getElementById('currentCityBadge'),
                btnSell: document.getElementById('btnSell'),
                btnRentOut: document.getElementById('btnRentOut'),
                btnRentIn: document.getElementById('btnRentIn')
            };

            // ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====
            function escapeHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function getDistricts() {
                return state.currentCity === 'novorossiysk' 
                    ? ['Центр', 'Южный район', 'Приморский', '13-й микрорайон', 'Мысхако', 'Цемдолина']
                    : ['Центр', 'Голубая бухта', 'Тонкий мыс', 'Архипо-Осиповка', 'Кабардинка'];
            }

            // ===== ВОПРОСЫ ДЛЯ КВИЗА =====
            function getQuestionsForAction(action) {
                const districts = getDistricts();
                switch (action) {
                    case 'sell':
                        return [
                            { text: '📍 В каком районе находится квартира?', options: districts },
                            { text: '🛏️ Сколько комнат?', options: ['Студия', '1-комнатная', '2-комнатная', '3+ комнат'] },
                            { text: '🌊 Есть ли вид на море?', options: ['Да, прямой вид', 'Частичный вид', 'Нет, вид во двор'] }
                        ];
                    case 'rent_out':
                        return [
                            { text: '📍 Где находится квартира?', options: districts },
                            { text: '📅 Тип аренды', options: ['Посуточная', 'Долгосрочная', 'Любой вариант'] },
                            { text: '🛋️ Сколько комнат?', options: ['Студия', '1-комнатная', '2-комнатная', '3+ комнат'] }
                        ];
                    case 'rent_in':
                        return [
                            { text: '🗺️ Какой район предпочтителен?', options: [...districts, 'Не важно'] },
                            { text: '⏳ Тип аренды', options: ['Посуточно', 'Долгосрочно', 'Рассмотрю оба варианта'] },
                            { text: '🚪 Сколько комнат нужно?', options: ['Студия', '1-комнатная', '2-комнатная', '3+ комнат'] },
                            { text: '💰 Какой бюджет?', options: ['до 20 000 ₽/мес', '20 000 - 35 000 ₽/мес', '35 000 - 50 000 ₽/мес', '50 000 - 80 000 ₽/мес', 'от 80 000 ₽/мес'] }
                        ];
                    default:
                        return [];
                }
            }

            function getEstimate() {
                if (state.currentAction === 'sell') {
                    const area = state.answers[0] || '';
                    if (state.currentCity === 'novorossiysk') {
                        if (area.includes('Центр')) return '≈ 105 000 - 120 000 ₽/м²';
                        if (area.includes('Южный')) return '≈ 90 000 - 100 000 ₽/м²';
                        return '≈ 85 000 - 110 000 ₽/м²';
                    } else {
                        if (area.includes('Центр')) return '≈ 120 000 - 140 000 ₽/м²';
                        if (area.includes('Голубая')) return '≈ 110 000 - 130 000 ₽/м²';
                        return '≈ 100 000 - 130 000 ₽/м²';
                    }
                }
                return 'индивидуальный расчёт';
            }

            // ===== ЧЕК-ЛИСТ (только для продажи) =====
            function getChecklistHtml() {
                const cityName = state.currentCity === 'novorossiysk' ? 'Новороссийске' : 'Геленджике';
                return `
                    <div class="checklist">
                        <h4>📋 Чек-лист: как быстро продать квартиру в ${escapeHtml(cityName)}</h4>
                        <ul>
                            <li>📸 Сделайте качественные фото (10-15 кадров при дневном свете)</li>
                            <li>🧹 Проведите предпродажную уборку, уберите личные вещи</li>
                            <li>📄 Подготовьте документы: выписка ЕГРН, техпаспорт</li>
                            <li>💰 Изучите цены на аналоги в вашем районе</li>
                            <li>🏷️ Установите цену на 3-5% выше рыночной (для торга)</li>
                            <li>🌐 Разместите объявление на Авито, Циан, Домклик</li>
                            <li>📞 Будьте на связи и оперативно отвечайте</li>
                        </ul>
                    </div>
                `;
            }

            // ===== ОТПРАВКА ДАННЫХ =====
            async function sendLead(leadData) {
                // Способ 1: Отправка через FormSubmit.co (бесплатно, простой)
                if (FORM_ACTION_URL && FORM_ACTION_URL.includes('formsubmit.co') && !FORM_ACTION_URL.includes('your-email')) {
                    const formData = new FormData();
                    formData.append('_subject', `Новая заявка | Оценка недвижимости`);
                    formData.append('_captcha', 'false');
                    formData.append('_template', 'table');
                    formData.append('Город', leadData.city === 'novorossiysk' ? 'Новороссийск' : 'Геленджик');
                    formData.append('Действие', leadData.action === 'sell' ? 'Продажа' : (leadData.action === 'rent_out' ? 'Сдать квартиру' : 'Арендовать'));
                    formData.append('Телефон', leadData.phone);
                    formData.append('Ответы', JSON.stringify(leadData.details, null, 2));
                    
                    const response = await fetch(FORM_ACTION_URL, {
                        method: 'POST',
                        body: formData
                    });
                    return response.ok;
                }
                
                // Способ 2: Отправка в Telegram (раскомментируйте и настройте константы вверху)
                // if (typeof TELEGRAM_API !== 'undefined' && TELEGRAM_API && TELEGRAM_CHAT_ID) {
                //     const text = `🆕 Новая заявка!\n\n🏙️ Город: ${leadData.city === 'novorossiysk' ? 'Новороссийск' : 'Геленджик'}\n📋 Действие: ${leadData.action}\n📞 Телефон: ${leadData.phone}\n📝 Детали: ${JSON.stringify(leadData.details)}`;
                //     const response = await fetch(TELEGRAM_API, {
                //         method: 'POST',
                //         headers: { 'Content-Type': 'application/json' },
                //         body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: text })
                //     });
                //     return response.ok;
                // }
                
                // Если ничего не настроено — просто логируем в консоль (для теста)
                console.log('📤 Заявка (демо-режим):', leadData);
                alert('⚡ Демо-режим: заявка не отправлена. Настройте получение заявок (см. инструкцию в коде).');
                return true;
            }

            // ===== РЕНДЕРИНГ КВИЗА =====
            function renderQuiz() {
                const questions = getQuestionsForAction(state.currentAction);
                const totalSteps = questions.length + 1;
                
                if (state.currentStep < questions.length) {
                    const q = questions[state.currentStep];
                    const progress = (state.currentStep / totalSteps) * 100;
                    
                    let html = `
                        <div class="progress-bar">
                            <div class="progress-fill" style="width:${progress}%"></div>
                        </div>
                        <h3 style="margin-bottom:1rem;">${escapeHtml(q.text)}</h3>
                    `;
                    
                    q.options.forEach((opt, idx) => {
                        const isSelected = state.answers[state.currentStep] === opt;
                        html += `<div class="quiz-option ${isSelected ? 'selected' : ''}" data-value="${escapeHtml(opt)}">${escapeHtml(opt)}</div>`;
                    });
                    
                    html += `<button class="btn" id="nextBtn">Далее →</button>`;
                    DOM.quizContent.innerHTML = html;
                    
                    // Обработчики
                    document.querySelectorAll('.quiz-option').forEach(opt => {
                        opt.addEventListener('click', (e) => {
                            document.querySelectorAll('.quiz-option').forEach(o => o.classList.remove('selected'));
                            opt.classList.add('selected');
                            state.answers[state.currentStep] = opt.dataset.value;
                        });
                    });
                    
                    document.getElementById('nextBtn').addEventListener('click', () => {
                        if (!state.answers[state.currentStep]) {
                            alert('Пожалуйста, выберите вариант ответа');
                            return;
                        }
                        state.currentStep++;
                        renderQuiz();
                    });
                    
                } else {
                    // Шаг с телефоном
                    const estimate = getEstimate();
                    DOM.quizContent.innerHTML = `
                        <div class="progress-bar">
                            <div class="progress-fill" style="width:100%"></div>
                        </div>
                        <h3>📞 Остался последний шаг!</h3>
                        <p style="margin-bottom:0.8rem;">Предварительная оценка: <strong>${escapeHtml(estimate)}</strong></p>
                        <input type="tel" class="input-phone" id="phoneInput" placeholder="+7 (___) ___-__-__" autocomplete="tel">
                        <button class="btn btn-success" id="submitBtn">📨 Получить оценку и чек-лист</button>
                    `;
                    
                    const phoneInput = document.getElementById('phoneInput');
                    const submitBtn = document.getElementById('submitBtn');
                    
                    // Форматирование телефона
                    phoneInput.addEventListener('input', function(e) {
                        let value = this.value.replace(/\D/g, '').substring(0, 11);
                        let formatted = '+7';
                        if (value.length > 1) formatted += ' (' + value.substring(1, 4);
                        if (value.length >= 5) formatted += ') ' + value.substring(4, 7);
                        if (value.length >= 8) formatted += '-' + value.substring(7, 9);
                        if (value.length >= 10) formatted += '-' + value.substring(9, 11);
                        this.value = formatted;
                    });
                    
                    submitBtn.addEventListener('click', async () => {
                        if (state.isSubmitting) return;
                        const phone = phoneInput.value.replace(/\D/g, '');
                        if (phone.length < 11) {
                            alert('Введите корректный номер телефона');
                            return;
                        }
                        
                        state.isSubmitting = true;
                        submitBtn.disabled = true;
                        submitBtn.textContent = 'Отправка...';
                        
                        state.phoneNumber = phoneInput.value;
                        
                        const lead = {
                            city: state.currentCity,
                            action: state.currentAction,
                            phone: state.phoneNumber,
                            details: state.answers,
                            timestamp: new Date().toISOString()
                        };
                        
                        const success = await sendLead(lead);
                        
                        if (success) {
                            // Показываем результат
                            const cityName = state.currentCity === 'novorossiysk' ? 'Новороссийск' : 'Геленджик';
                            const actionName = state.currentAction === 'sell' ? 'продажи' : (state.currentAction === 'rent_out' ? 'сдачи' : 'аренды');
                            
                            DOM.quizContent.innerHTML = `
                                <div class="text-center">
                                    <h2>✅ Спасибо за заявку!</h2>
                                    <p style="margin:1rem 0;">Мы свяжемся с вами в ближайшее время.</p>
                                    ${state.currentAction === 'sell' ? getChecklistHtml() : '<div class="bonus">🎁 Чек-лист по аренде будет отправлен вам на почту или в мессенджер</div>'}
                                    <div class="data-output">
                                        <strong>Ваши данные:</strong><br>
                                        Город: ${escapeHtml(cityName)}<br>
                                        Тип: ${actionName === 'аренды' ? 'Аренда' : (actionName === 'продажи' ? 'Продажа' : 'Сдача')}<br>
                                        Телефон: ${escapeHtml(state.phoneNumber)}
                                    </div>
                                    <button class="btn btn-outline" id="resetBtn">🔄 Новый запрос</button>
                                    ${state.currentAction === 'sell' ? '<button class="small-link" id="printBtn">🖨️ Распечатать чек-лист</button>' : ''}
                                </div>
                            `;
                            
                            document.getElementById('resetBtn').addEventListener('click', () => {
                                state.currentStep = 0;
                                state.answers = [];
                                state.phoneNumber = '';
                                state.isSubmitting = false;
                                state.currentAction = null;
                                state.currentCity = null;
                                DOM.step2.style.display = 'none';
                                DOM.step1.style.display = 'block';
                                // сброс выбора города
                                DOM.cityNovoros.classList.remove('active');
                                DOM.cityGelendzhik.classList.remove('active');
                                DOM.currentCityBadge.textContent = '🏙️ Выберите город';
                                DOM.currentCityBadge.style.background = '#f9a826';
                                DOM.btnSell.disabled = true;
                                DOM.btnRentOut.disabled = true;
                                DOM.btnRentIn.disabled = true;
                            });
                            
                            if (document.getElementById('printBtn')) {
                                document.getElementById('printBtn').addEventListener('click', () => window.print());
                            }
                        } else {
                            alert('Произошла ошибка при отправке. Пожалуйста, попробуйте позже.');
                            state.isSubmitting = false;
                            submitBtn.disabled = false;
                            submitBtn.textContent = '📨 Получить оценку и чек-лист';
                        }
                    });
                }
            }

            // ===== ВЫБОР ГОРОДА =====
            function selectCity(city) {
                state.currentCity = city;
                DOM.cityNovoros.classList.toggle('active', city === 'novorossiysk');
                DOM.cityGelendzhik.classList.toggle('active', city === 'gelendzhik');
                DOM.currentCityBadge.textContent = city === 'novorossiysk' ? '🌊 Новороссийск' : '🏖️ Геленджик';
                DOM.currentCityBadge.style.background = city === 'novorossiysk' ? '#1e7a9c' : '#f9a826';
                
                DOM.btnSell.disabled = false;
                DOM.btnRentOut.disabled = false;
                DOM.btnRentIn.disabled = false;
            }

            // ===== ЗАПУСК КВИЗА =====
            function startQuiz(action) {
                if (!state.currentCity) return;
                state.currentAction = action;
                state.currentStep = 0;
                state.answers = [];
                state.phoneNumber = '';
                state.isSubmitting = false;
                DOM.step1.style.display = 'none';
                DOM.step2.style.display = 'block';
                renderQuiz();
            }

            // ===== ИНИЦИАЛИЗАЦИЯ =====
            function init() {
                DOM.cityNovoros.addEventListener('click', () => selectCity('novorossiysk'));
                DOM.cityGelendzhik.addEventListener('click', () => selectCity('gelendzhik'));
                DOM.btnSell.addEventListener('click', () => startQuiz('sell'));
                DOM.btnRentOut.addEventListener('click', () => startQuiz('rent_out'));
                DOM.btnRentIn.addEventListener('click', () => startQuiz('rent_in'));
            }
            
            init();
        })();
    </script>
</body>
</html>
