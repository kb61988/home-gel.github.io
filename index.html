    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {

<body>
    <div class="container">
        <!-- Белая плашка с названием города -->
        <div class="hero-white-card">
            <div class="hero-city">🌊 Геленджик</div>
            <div class="hero-sub">Жемчужина Черноморского побережья</div>
        </div>
        
        <div class="card text-center">
            <h1>📊 Оценка недвижимости</h1>
            <p class="subtitle">Продажа · Покупка · Аренда · Быстрый расчёт</p>
            <div class="city-badge" id="currentCityBadge">🏙️ Выберите город</div>
        </div>

        <div id="step1" class="card">
            <div class="city-selector">
                <button class="city-btn" id="cityNovoros">🌊 Новороссийск</button>
                <button class="city-btn" id="cityGelendzhik">🏖️ Геленджик</button>
            </div>
            <button class="btn" id="btnSell" disabled>🏠 Хочу продать квартиру</button>
            <button class="btn btn-outline" id="btnBuy" disabled>💰 Хочу купить квартиру</button>
            <button class="btn btn-outline" id="btnRentOut" disabled>🔑 Хочу сдать квартиру</button>
            <button class="btn btn-outline" id="btnRentIn" disabled>🏢 Хочу арендовать</button>
            <p style="font-size:0.8rem; color:#5f6b7a; margin-top:0.6rem; text-align:center;">👆 Сначала выберите город</p>
        </div>

        <div id="step2" class="card" style="display:none;">
            <div id="quizContent"></div>
        </div>
        
        <!-- Общее сообщение об ошибке -->
        <div id="globalError" class="alert"></div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== БЕЗОПАСНАЯ КОНФИГУРАЦИЯ =====
            // Токены и секреты хранятся ТОЛЬКО на сервере (api/send-lead.php)
            const API_ENDPOINT = '/api/send-lead.php'; // Путь к серверному обработчику
            
            // Настройки валидации
            const VALIDATION = {
                phoneRegex: /^7\d{10}$/,
                minNameLength: 2,
                maxNameLength: 50,
                phoneMaskRegex: /^\+7\s?\(?\d{3}\)?\s?\d{3}-?\d{2}-?\d{2}$/
            };

            // ===== СОСТОЯНИЕ ПРИЛОЖЕНИЯ =====
            const state = {
                currentCity: null,
                currentAction: null,
                currentStep: 0,
                answers: [],
                clientName: '',
                phoneNumber: '',
                isSubmitting: false,
                csrfToken: null // Для будущей CSRF защиты
            };

            // ===== DOM ЭЛЕМЕНТЫ =====
            const DOM = {
                step1: document.getElementById('step1'),
                step2: document.getElementById('step2'),
                quizContent: document.getElementById('quizContent'),
                cityNovoros: document.getElementById('cityNovoros'),
                cityGelendzhik: document.getElementById('cityGelendzhik'),
                currentCityBadge: document.getElementById('currentCityBadge'),
                btnSell: document.getElementById('btnSell'),
                btnBuy: document.getElementById('btnBuy'),
                btnRentOut: document.getElementById('btnRentOut'),
                btnRentIn: document.getElementById('btnRentIn'),
                globalError: document.getElementById('globalError')
            };

            // ===== УТИЛИТЫ БЕЗОПАСНОСТИ =====
            
            /**
             * Безопасное экранирование HTML
             * Использует textContent для предотвращения XSS
             */
            function escapeHtml(str) {
                if (!str && str !== 0) return '';
                const div = document.createElement('div');
                div.textContent = String(str);
                return div.innerHTML;
            }

            /**
             * Безопасная вставка текста в DOM элемент
             * Предпочтительный метод вместо innerHTML
             */
            function safeSetText(element, text) {
                if (element) {
                    element.textContent = text;
                }
            }

            /**
             * Санитизация строки: удаление HTML тегов и опасных символов
             */
            function sanitizeString(str) {
                if (typeof str !== 'string') return '';
                return str.replace(/[<>"'&]/g, function(match) {
                    const chars = {
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#x27;',
                        '&': '&amp;'
                    };
                    return chars[match];
                });
            }

            /**
             * Валидация номера телефона
             */
            function validatePhone(phone) {
                const cleaned = phone.replace(/\D/g, '');
                return VALIDATION.phoneRegex.test(cleaned);
            }

            /**
             * Валидация имени
             */
            function validateName(name) {
                const trimmed = name.trim();
                return trimmed.length >= VALIDATION.minNameLength && 
                       trimmed.length <= VALIDATION.maxNameLength;
            }

            /**
             * Показать ошибку валидации для поля
             */
            function showFieldError(inputElement, message) {
                inputElement.classList.add('error');
                const errorDiv = inputElement.nextElementSibling;
                if (errorDiv && errorDiv.classList.contains('error-message')) {
                    errorDiv.textContent = message;
                    errorDiv.classList.add('visible');
                }
            }

            /**
             * Очистить ошибку валидации
             */
            function clearFieldError(inputElement) {
                inputElement.classList.remove('error');
                const errorDiv = inputElement.nextElementSibling;
                if (errorDiv && errorDiv.classList.contains('error-message')) {
                    errorDiv.classList.remove('visible');
                }
            }

            /**
             * Показать глобальную ошибку
             */
            function showGlobalError(message, type = 'error') {
                DOM.globalError.textContent = message;
                DOM.globalError.className = 'alert';
                if (type === 'error') {
                    DOM.globalError.classList.add('alert-error');
                } else if (type === 'success') {
                    DOM.globalError.classList.add('alert-success');
                }
                DOM.globalError.style.display = 'block';
                
                // Автоматически скрыть через 5 секунд
                setTimeout(() => {
                    DOM.globalError.style.display = 'none';
                }, 5000);
            }

            // ===== ДАННЫЕ =====

            function getDistricts() {
                return state.currentCity === 'novorossiysk' 
                    ? ['Центр', 'Южный район', 'Приморский', '13-й микрорайон', 'Мысхако', 'Цемдолина']
                    : ['Центр', 'Голубая бухта', 'Тонкий мыс', 'Архипо-Осиповка', 'Кабардинка'];
            }

            function getQuestionsForAction(action) {
                const districts = getDistricts();
                switch (action) {
                    case 'sell':
                        return [
                            { text: '📍 В каком районе находится квартира?', options: districts },
                            { text: '🛏️ Сколько комнат?', options: ['Студия', '1-комнатная', '2-комнатная', '3+ комнат'] },
                            { text: '🌊 Есть ли вид на море?', options: ['Да, прямой вид', 'Частичный вид', 'Нет, вид во двор'] }
                        ];
                    case 'buy':
                        return [
                            { text: '📍 Какой район предпочтителен?', options: [...districts, 'Не важно'] },
                            { text: '🛏️ Сколько комнат нужно?', options: ['Студия', '1-комнатная', '2-комнатная', '3+ комнат'] },
                            { text: '💰 Какой бюджет?', options: ['до 3 млн ₽', '3 - 5 млн ₽', '5 - 8 млн ₽', '8 - 12 млн ₽', 'от 12 млн ₽'] },
                            { text: '🌊 Важен ли вид на море?', options: ['Обязательно', 'Желательно', 'Не важно'] }
                        ];
                    case 'rent_out':
                        return [
                            { text: '📍 Где находится квартира?', options: districts },
                            { text: '📅 Тип аренды', options: ['Посуточная', 'Долгосрочная', 'Любой вариант'] },
                            { text: '🛋️ Сколько комнат?', options: ['Студия', '1-комнатная', '2-комнатная', '3+ комнат'] }
                        ];
                    case 'rent_in':
                        return [
                            { text: '🗺️ Какой район предпочтителен?', options: [...districts, 'Не важно'] },
                            { text: '⏳ Тип аренды', options: ['Посуточно', 'Долгосрочно', 'Рассмотрю оба варианта'] },
                            { text: '🚪 Сколько комнат нужно?', options: ['Студия', '1-комнатная', '2-комнатная', '3+ комнат'] },
                            { text: '💰 Какой бюджет?', options: ['до 20 000 ₽/мес', '20 000 - 35 000 ₽/мес', '35 000 - 50 000 ₽/мес', '50 000 - 80 000 ₽/мес', 'от 80 000 ₽/мес'] }
                        ];
                    default:
                        return [];
                }
            }

            function getEstimate() {
                if (state.currentAction === 'sell') {
                    const area = state.answers[0] || '';
                    if (state.currentCity === 'novorossiysk') {
                        if (area.includes('Центр')) return '≈ 105 000 - 120 000 ₽/м²';
                        if (area.includes('Южный')) return '≈ 90 000 - 100 000 ₽/м²';
                        return '≈ 85 000 - 110 000 ₽/м²';
                    } else {
                        if (area.includes('Центр')) return '≈ 120 000 - 140 000 ₽/м²';
                        if (area.includes('Голубая')) return '≈ 110 000 - 130 000 ₽/м²';
                        return '≈ 100 000 - 130 000 ₽/м²';
                    }
                }
                return 'индивидуальный расчёт';
            }

            // ===== ОТПРАВКА ДАННЫХ =====

            /**
             * Безопасная отправка лида на сервер
             * Сервер сам отправляет данные в Telegram
             */
            async function sendLead(leadData) {
                try {
                    // Добавляем таймаут для fetch
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000); // 15 секунд
                    
                    const response = await fetch(API_ENDPOINT, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest' // Защита от простых CSRF
                        },
                        body: JSON.stringify(leadData),
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.error || `Ошибка сервера: ${response.status}`);
                    }
                    
                    const result = await response.json();
                    return result.success === true;
                    
                } catch (error) {
                    if (error.name === 'AbortError') {
                        console.error('Таймаут запроса');
                        return false;
                    }
                    console.error('Ошибка отправки:', error.message);
                    return false;
                }
            }

            // ===== ОТОБРАЖЕНИЕ КВИЗА =====

            function renderQuiz() {
                const questions = getQuestionsForAction(state.currentAction);
                const totalSteps = questions.length + 1;
                
                if (state.currentStep < questions.length) {
                    const q = questions[state.currentStep];
                    const progress = (state.currentStep / totalSteps) * 100;
                    
                    let html = `
                        <div class="progress-bar">
                            <div class="progress-fill" style="width:${progress}%"></div>
                        </div>
                        <h3 style="margin-bottom:1rem;">${escapeHtml(q.text)}</h3>
                    `;
                    
                    q.options.forEach((opt) => {
                        const isSelected = state.answers[state.currentStep] === opt;
                        html += `<div class="quiz-option ${isSelected ? 'selected' : ''}" data-value="${escapeHtml(opt)}">${escapeHtml(opt)}</div>`;
                    });
                    
                    html += `<button class="btn" id="nextBtn">Далее →</button>`;
                    DOM.quizContent.innerHTML = html;
                    
                    // Обработчики для опций
                    document.querySelectorAll('.quiz-option').forEach(opt => {
                        opt.addEventListener('click', () => {
                            document.querySelectorAll('.quiz-option').forEach(o => o.classList.remove('selected'));
                            opt.classList.add('selected');
                            state.answers[state.currentStep] = opt.dataset.value;
                        });
                    });
                    
                    // Обработчик кнопки "Далее"
                    document.getElementById('nextBtn').addEventListener('click', () => {
                        if (!state.answers[state.currentStep]) {
                            showGlobalError('Пожалуйста, выберите вариант ответа');
                            return;
                        }
                        state.currentStep++;
                        renderQuiz();
                    });
                } else {
                    // Финальный шаг - форма контактов
                    renderContactForm();
                }
            }

            function renderContactForm() {
                const estimate = getEstimate();
                const progress = 100;
                
                DOM.quizContent.innerHTML = `
                    <div class="progress-bar">
                        <div class="progress-fill" style="width:${progress}%"></div>
                    </div>
                    <h3>📞 Остался последний шаг!</h3>
                    <p style="margin-bottom:0.8rem;">Предварительная оценка: <strong>${escapeHtml(estimate)}</strong></p>
                    <div>
                        <input type="text" class="input-field" id="nameInput" placeholder="👤 Ваше имя" autocomplete="name" maxlength="50">
                        <div class="error-message" id="nameError"></div>
                    </div>
                    <div>
                        <input type="tel" class="input-phone" id="phoneInput" placeholder="📞 +7 (___) ___-__-__" autocomplete="tel">
                        <div class="error-message" id="phoneError"></div>
                    </div>
                    <button class="btn btn-success" id="submitBtn">
                        <span class="btn-text">📨 Отправить заявку</span>
                    </button>
                `;
                
                const nameInput = document.getElementById('nameInput');
                const phoneInput = document.getElementById('phoneInput');
                const submitBtn = document.getElementById('submitBtn');
                
                // Маска телефона с валидацией
                phoneInput.addEventListener('input', function(e) {
                    let value = this.value.replace(/\D/g, '').substring(0, 11);
                    let formatted = '+7';
                    if (value.length > 1) formatted += ' (' + value.substring(1, 4);
                    if (value.length >= 5) formatted += ') ' + value.substring(4, 7);
                    if (value.length >= 8) formatted += '-' + value.substring(7, 9);
                    if (value.length >= 10) formatted += '-' + value.substring(9, 11);
                    this.value = formatted;
                    clearFieldError(phoneInput);
                });
                
                // Валидация имени при вводе
                nameInput.addEventListener('input', () => {
                    clearFieldError(nameInput);
                });
                
                // Обработчик отправки
                submitBtn.addEventListener('click', async () => {
                    if (state.isSubmitting) return;
                    
                    // Сброс ошибок
                    clearFieldError(nameInput);
                    clearFieldError(phoneInput);
                    
                    let hasErrors = false;
                    
                    // Валидация имени
                    const clientName = nameInput.value.trim();
                    if (!validateName(clientName)) {
                        showFieldError(nameInput, 'Имя должно содержать от 2 до 50 символов');
                        nameInput.focus();
                        hasErrors = true;
                    }
                    
                    // Валидация телефона
                    const phoneRaw = phoneInput.value;
                    if (!validatePhone(phoneRaw)) {
                        showFieldError(phoneInput, 'Введите корректный номер телефона (+7...)');
                        if (!hasErrors) phoneInput.focus();
                        hasErrors = true;
                    }
                    
                    if (hasErrors) return;
                    
                    // Блокировка формы
                    state.isSubmitting = true;
                    submitBtn.disabled = true;
                    submitBtn.classList.add('btn-loading');
                    
                    state.clientName = sanitizeString(clientName);
                    state.phoneNumber = phoneRaw;
                    
                    const lead = {
                        city: state.currentCity,
                        action: state.currentAction,
                        name: state.clientName,
                        phone: state.phoneNumber,
                        details: state.answers.map(a => sanitizeString(a)),
                        timestamp: new Date().toISOString()
                    };
                    
                    // Отправка через безопасный API
                    const success = await sendLead(lead);
                    
                    if (success) {
                        showSuccessScreen();
                    } else {
                        state.isSubmitting = false;
                        submitBtn.disabled = false;
                        submitBtn.classList.remove('btn-loading');
                        showGlobalError('❌ Ошибка при отправке. Пожалуйста, попробуйте позже.');
                    }
                });
                
                // Отправка по Enter
                phoneInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !state.isSubmitting) {
                        submitBtn.click();
                    }
                });
            }

            function showSuccessScreen() {
                const cityName = state.currentCity === 'novorossiysk' ? 'Новороссийск' : 'Геленджик';
                const actionText = {
                    'sell': 'ПРОДАЖА',
                    'buy': 'ПОКУПКА',
                    'rent_out': 'СДАЧА',
                    'rent_in': 'АРЕНДА'
                }[state.currentAction];
                
                // Безопасное отображение данных (все уже санитизировано)
                DOM.quizContent.innerHTML = `
                    <div class="text-center">
                        <h2>✅ Спасибо за заявку!</h2>
                        <p style="margin:1rem 0;">Мы свяжемся с вами в ближайшее время.</p>
                        <div class="bonus">🎁 Специалист подберёт для вас лучшие варианты</div>
                        <div class="data-output">
                            <strong>Ваши данные:</strong><br>
                            Город: ${escapeHtml(cityName)}<br>
                            Тип: ${escapeHtml(actionText)}<br>
                            Имя: ${escapeHtml(state.clientName)}<br>
                            Телефон: ${escapeHtml(state.phoneNumber)}
                        </div>
                        <button class="btn btn-outline" id="resetBtn">🔄 Новый запрос</button>
                    </div>
                `;
                
                document.getElementById('resetBtn').addEventListener('click', resetApp);
            }

            // ===== УПРАВЛЕНИЕ СОСТОЯНИЕМ =====

            function resetApp() {
                state.currentStep = 0;
                state.answers = [];
                state.clientName = '';
                state.phoneNumber = '';
                state.isSubmitting = false;
                state.currentAction = null;
                state.currentCity = null;
                
                DOM.step2.style.display = 'none';
                DOM.step1.style.display = 'block';
                DOM.cityNovoros.classList.remove('active');
                DOM.cityGelendzhik.classList.remove('active');
                DOM.currentCityBadge.textContent = '🏙️ Выберите город';
                DOM.currentCityBadge.style.background = '#f9a826';
                DOM.btnSell.disabled = true;
                DOM.btnBuy.disabled = true;
                DOM.btnRentOut.disabled = true;
                DOM.btnRentIn.disabled = true;
                DOM.globalError.style.display = 'none';
                
                // Плавный скролл вверх
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function selectCity(city) {
                state.currentCity = city;
                DOM.cityNovoros.classList.toggle('active', city === 'novorossiysk');
                DOM.cityGelendzhik.classList.toggle('active', city === 'gelendzhik');
                DOM.currentCityBadge.textContent = city === 'novorossiysk' ? '🌊 Новороссийск' : '🏖️ Геленджик';
                DOM.currentCityBadge.style.background = city === 'novorossiysk' ? '#1e7a9c' : '#f9a826';
                
                DOM.btnSell.disabled = false;
                DOM.btnBuy.disabled = false;
                DOM.btnRentOut.disabled = false;
                DOM.btnRentIn.disabled = false;
            }

            function startQuiz(action) {
                if (!state.currentCity) {
                    showGlobalError('Пожалуйста, сначала выберите город');
                    return;
                }
                
                state.currentAction = action;
                state.currentStep = 0;
                state.answers = [];
                state.clientName = '';
                state.phoneNumber = '';
                state.isSubmitting = false;
                
                DOM.step1.style.display = 'none';
                DOM.step2.style.display = 'block';
                DOM.globalError.style.display = 'none';
                
                renderQuiz();
                
                // Плавный скролл к квизу
                DOM.step2.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            // ===== ИНИЦИАЛИЗАЦИЯ =====

            function init() {
                DOM.cityNovoros.addEventListener('click', () => selectCity('novorossiysk'));
                DOM.cityGelendzhik.addEventListener('click', () => selectCity('gelendzhik'));
                DOM.btnSell.addEventListener('click', () => startQuiz('sell'));
                DOM.btnBuy.addEventListener('click', () => startQuiz('buy'));
                DOM.btnRentOut.addEventListener('click', () => startQuiz('rent_out'));
                DOM.btnRentIn.addEventListener('click', () => startQuiz('rent_in'));
                
                // Отключаем двойную отправку для всех кнопок
                document.addEventListener('dblclick', function(e) {
                    if (e.target.tagName === 'BUTTON' && e.target.disabled) {
                        e.preventDefault();
                    }
                });
                
                console.log('🔒 Приложение инициализировано с безопасной архитектурой');
            }
            
            // Запуск при загрузке страницы
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
