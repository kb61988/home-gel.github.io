<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Оценка недвижимости | Геленджик & Новороссийск</title>
    <meta name="description" content="Бесплатная оценка стоимости недвижимости в Геленджике и Новороссийске. Продажа, покупка, аренда, быстрый расчёт за 2 минуты.">
    <meta name="robots" content="index, follow">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #1e7a9c; --primary-dark: #146480; --accent: #f9a826; --success: #2a9d8f; --danger: #e74c3c; }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-image: url('https://www.onetwotrip.com/ru/blog/wp-content/uploads/2021/01/%D0%93%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0%D1%8F.jpg');
            background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat;
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.2rem; position: relative;
        }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 0; }
        
        .container { width: 100%; max-width: 550px; margin: 0 auto; position: relative; z-index: 1; }
        
        .hero-white-card {
            background: rgba(255,255,255,0.96); backdrop-filter: blur(14px); border-radius: 32px; padding: 1.5rem;
            text-align: center; box-shadow: 0 20px 35px rgba(0,20,30,0.12); border: 1px solid rgba(255,255,255,0.7);
            width: 100%; margin-bottom: 1rem;
        }
        .hero-city { color: #1e7a9c; font-size: 1.8rem; font-weight: 800; margin-bottom: 8px; }
        .hero-sub { color: #2c3e50; font-size: 0.9rem; font-weight: 500; }
        
        .card {
            background: rgba(255,255,255,0.96); backdrop-filter: blur(14px); border-radius: 32px; padding: 1.8rem 1.5rem;
            margin-bottom: 1.2rem; box-shadow: 0 20px 35px rgba(0,20,30,0.12); border: 1px solid rgba(255,255,255,0.7);
        }
        .text-center { text-align: center; }
        
        h1 {
            font-size: 1.8rem; font-weight: 700;
            background: linear-gradient(135deg, #0b4f6c, #1e7a9c);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 0.2rem;
        }
        .subtitle { color: #2c3e50; font-size: 1rem; font-weight: 500; margin-bottom: 1rem; }
        
        .city-badge {
            background: #f9a826; color: white; padding: 0.4rem 1.4rem; border-radius: 30px; display: inline-block;
            font-weight: 600; font-size: 1rem; box-shadow: 0 8px 14px rgba(249,168,38,0.3);
        }
        
        .btn {
            display: block; width: 100%; padding: 1rem 1.2rem; background: #1e7a9c; color: white; border: none;
            border-radius: 60px; font-size: 1.1rem; font-weight: 600; cursor: pointer; margin-bottom: 0.8rem;
            text-align: center; transition: all 0.25s ease; box-shadow: 0 6px 14px rgba(30,122,156,0.25);
        }
        .btn:hover { background: #146480; transform: translateY(-2px); }
        .btn-outline { background: white; color: #1e7a9c; border: 2px solid #1e7a9c; box-shadow: none; }
        .btn-outline:hover { background: #f0f9ff; }
        .btn-success { background: #2a9d8f; }
        .btn:disabled { opacity: 0.5; pointer-events: none; cursor: not-allowed; }
        
        .btn-loading { position: relative; color: transparent !important; }
        .btn-loading::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            margin: -10px 0 0 -10px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .city-selector { display: flex; gap: 0.8rem; margin-bottom: 1.4rem; justify-content: center; }
        .city-btn { flex: 1; padding: 0.8rem; border: 2px solid #dce5ec; border-radius: 20px; background: white; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .city-btn.active { background: #1e7a9c; color: white; border-color: #1e7a9c; }
        
        .quiz-option {
            padding: 0.9rem 1.2rem; border: 2px solid #e0e7ef; border-radius: 18px; margin-bottom: 0.7rem;
            cursor: pointer; transition: all 0.2s; background: #fff; font-weight: 500; color: #1e293b;
        }
        .quiz-option:hover { border-color: #1e7a9c; background: #f6fcff; }
        .quiz-option.selected { border-color: #1e7a9c; background: #e1f3fb; font-weight: 600; }
        
        .input-field, .input-phone {
            width: 100%; padding: 1rem 1.2rem; border: 2px solid #e0e7ef; border-radius: 20px;
            font-size: 1rem; margin-bottom: 1rem; background: white; outline: none;
        }
        .input-field:focus, .input-phone:focus { border-color: #1e7a9c; box-shadow: 0 0 0 3px rgba(30,122,156,0.2); }
        .input-field.error, .input-phone.error { border-color: #e74c3c; }
        .error-message { color: #e74c3c; font-size: 0.85rem; margin-top: -0.8rem; margin-bottom: 1rem; display: none; text-align: left; padding-left: 0.5rem; }
        .error-message.visible { display: block; }
        
        .progress-bar { height: 8px; background: #e2e8f0; border-radius: 20px; margin: 0.7rem 0 1.3rem; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #1e7a9c, #2a9d8f); border-radius: 20px; transition: width 0.35s ease; }
        
        .data-output { background: #f4f9fc; border: 1px solid #cbdbe9; border-radius: 18px; padding: 1rem 1.2rem; margin: 1.2rem 0; font-size: 0.9rem; word-break: break-word; }
        .bonus { background: #fff7e0; padding: 1rem; border-radius: 18px; margin: 1.2rem 0; font-weight: 500; border: 1px solid #ffe5b9; }
        .alert { padding: 1rem; border-radius: 18px; margin: 1rem 0; font-weight: 500; display: none; }
        .alert-error { background: #fde8e8; border: 1px solid #f5c6cb; color: #e74c3c; display: block; }
        .alert-success { background: #e8f5e9; border: 1px solid #c8e6c9; color: #2e7d32; display: block; }
        
        @media (max-width: 480px) {
            .card { padding: 1.2rem; }
            h1 { font-size: 1.4rem; }
            .hero-white-card { padding: 1rem; }
            .hero-city { font-size: 1.3rem; }
            .hero-sub { font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero-white-card">
            <div class="hero-city">🌊 Геленджик</div>
            <div class="hero-sub">Жемчужина Черноморского побережья</div>
        </div>
        
        <div class="card text-center">
            <h1>📊 Оценка недвижимости</h1>
            <p class="subtitle">Продажа · Покупка · Аренда · Быстрый расчёт</p>
            <div class="city-badge" id="currentCityBadge">🏙️ Выберите город</div>
        </div>

        <div id="step1" class="card">
            <div class="city-selector">
                <button class="city-btn" id="cityNovoros">🌊 Новороссийск</button>
                <button class="city-btn" id="cityGelendzhik">🏖️ Геленджик</button>
            </div>
            <button class="btn" id="btnSell" disabled>🏠 Хочу продать квартиру</button>
            <button class="btn btn-outline" id="btnBuy" disabled>💰 Хочу купить квартиру</button>
            <button class="btn btn-outline" id="btnRentOut" disabled>🔑 Хочу сдать квартиру</button>
            <button class="btn btn-outline" id="btnRentIn" disabled>🏢 Хочу арендовать</button>
            <p style="font-size:0.8rem; color:#5f6b7a; margin-top:0.6rem; text-align:center;">👆 Сначала выберите город</p>
        </div>

        <div id="step2" class="card" style="display:none;">
            <div id="quizContent"></div>
        </div>
        
        <div id="globalError" class="alert"></div>
    </div>

    <script>
        (function() {
            'use strict';

            // Токен собран из 4 частей (защита от простых сканеров)
            const BOT_TOKEN = (() => {
                const p = [
                    'ODgzNjY5NTIx',
                    'NTpBQUZYd2Iw',
                    'MmV4MkRlc1RS',
                    'bGt6alk5WDUwWVpoTkZwS3FPQQ=='
                ];
                return atob(p.join(''));
            })();
            
            const CHAT_ID = '383582538';
            const API_URL = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            
            // Rate limiting: 30 секунд между отправками
            let lastSubmitTime = 0;
            const RATE_LIMIT_MS = 30000;

            const state = {
                currentCity: null, currentAction: null, currentStep: 0,
                answers: [], clientName: '', phoneNumber: '', isSubmitting: false
            };

            const DOM = {
                step1: document.getElementById('step1'),
                step2: document.getElementById('step2'),
                quizContent: document.getElementById('quizContent'),
                cityNovoros: document.getElementById('cityNovoros'),
                cityGelendzhik: document.getElementById('cityGelendzhik'),
                currentCityBadge: document.getElementById('currentCityBadge'),
                btnSell: document.getElementById('btnSell'),
                btnBuy: document.getElementById('btnBuy'),
                btnRentOut: document.getElementById('btnRentOut'),
                btnRentIn: document.getElementById('btnRentIn'),
                globalError: document.getElementById('globalError')
            };

            function escapeHtml(str) {
                if (!str && str !== 0) return '';
                const div = document.createElement('div');
                div.textContent = String(str);
                return div.innerHTML;
            }

            function sanitizeString(str) {
                if (typeof str !== 'string') return '';
                return str.replace(/[<>"'&]/g, c => ({'<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#x27;','&':'&amp;'})[c]);
            }

            function validatePhone(phone) { return /^7\d{10}$/.test(phone.replace(/\D/g, '')); }
            function validateName(name) { const t = name.trim(); return t.length >= 2 && t.length <= 50; }

            function showFieldError(el, msg) {
                el.classList.add('error');
                const err = el.nextElementSibling;
                if (err && err.classList.contains('error-message')) {
                    err.textContent = msg; err.classList.add('visible');
                }
            }

            function clearFieldError(el) {
                el.classList.remove('error');
                const err = el.nextElementSibling;
                if (err && err.classList.contains('error-message')) err.classList.remove('visible');
            }

            function showGlobalError(msg) {
                DOM.globalError.textContent = msg;
                DOM.globalError.className = 'alert alert-error';
                setTimeout(() => { DOM.globalError.style.display = 'none'; }, 5000);
            }

            function getDistricts() {
                return state.currentCity === 'novorossiysk'
                    ? ['Центр', 'Южный район', 'Приморский', '13-й микрорайон', 'Мысхако', 'Цемдолина']
                    : ['Центр', 'Голубая бухта', 'Тонкий мыс', 'Архипо-Осиповка', 'Кабардинка'];
            }

            function getQuestionsForAction(action) {
                const d = getDistricts();
                switch (action) {
                    case 'sell': return [
                        { text: '📍 В каком районе находится квартира?', options: d },
                        { text: '🛏️ Сколько комнат?', options: ['Студия', '1-комнатная', '2-комнатная', '3+ комнат'] },
                        { text: '🌊 Есть ли вид на море?', options: ['Да, прямой вид', 'Частичный вид', 'Нет, вид во двор'] }
                    ];
                    case 'buy': return [
                        { text: '📍 Какой район предпочтителен?', options: [...d, 'Не важно'] },
                        { text: '🛏️ Сколько комнат нужно?', options: ['Студия', '1-комнатная', '2-комнатная', '3+ комнат'] },
                        { text: '💰 Какой бюджет?', options: ['до 3 млн ₽', '3 - 5 млн ₽', '5 - 8 млн ₽', '8 - 12 млн ₽', 'от 12 млн ₽'] },
                        { text: '🌊 Важен ли вид на море?', options: ['Обязательно', 'Желательно', 'Не важно'] }
                    ];
                    case 'rent_out': return [
                        { text: '📍 Где находится квартира?', options: d },
                        { text: '📅 Тип аренды', options: ['Посуточная', 'Долгосрочная', 'Любой вариант'] },
                        { text: '🛋️ Сколько комнат?', options: ['Студия', '1-комнатная', '2-комнатная', '3+ комнат'] }
                    ];
                    case 'rent_in': return [
                        { text: '🗺️ Какой район предпочтителен?', options: [...d, 'Не важно'] },
                        { text: '⏳ Тип аренды', options: ['Посуточно', 'Долгосрочно', 'Рассмотрю оба варианта'] },
                        { text: '🚪 Сколько комнат нужно?', options: ['Студия', '1-комнатная', '2-комнатная', '3+ комнат'] },
                        { text: '💰 Какой бюджет?', options: ['до 20 000 ₽/мес', '20 000 - 35 000 ₽/мес', '35 000 - 50 000 ₽/мес', '50 000 - 80 000 ₽/мес', 'от 80 000 ₽/мес'] }
                    ];
                    default: return [];
                }
            }

            function getEstimate() {
                if (state.currentAction === 'sell') {
                    const a = state.answers[0] || '';
                    if (state.currentCity === 'novorossiysk') {
                        if (a.includes('Центр')) return '≈ 105 000 - 120 000 ₽/м²';
                        if (a.includes('Южный')) return '≈ 90 000 - 100 000 ₽/м²';
                        return '≈ 85 000 - 110 000 ₽/м²';
                    } else {
                        if (a.includes('Центр')) return '≈ 120 000 - 140 000 ₽/м²';
                        if (a.includes('Голубая')) return '≈ 110 000 - 130 000 ₽/м²';
                        return '≈ 100 000 - 130 000 ₽/м²';
                    }
                }
                return 'индивидуальный расчёт';
            }

            async function sendToTelegram(data) {
                const cityName = data.city === 'novorossiysk' ? '🌊 Новороссийск' : '🏖️ Геленджик';
                const actions = { sell:'🏠 ПРОДАЖА', buy:'💰 ПОКУПКА', rent_out:'🔑 СДАЧА', rent_in:'🏢 АРЕНДА' };
                
                const msg = [
                    '🆕 НОВАЯ ЗАЯВКА!', '',
                    `📍 Город: ${cityName}`,
                    `📋 Тип: ${actions[data.action]}`,
                    `👤 Имя: ${data.name}`,
                    `📞 Телефон: ${data.phone}`,
                    '📝 Ответы:',
                    ...data.details.map((a,i) => `  ${i+1}. ${a}`),
                    '', `⏰ ${new Date().toLocaleString('ru-RU')}`
                ].join('\n');

                const ctrl = new AbortController();
                const timeout = setTimeout(() => ctrl.abort(), 10000);

                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: msg,
                            parse_mode: 'HTML',
                            disable_web_page_preview: true
                        }),
                        signal: ctrl.signal
                    });
                    clearTimeout(timeout);
                    const json = await res.json();
                    return json.ok === true;
                } catch (e) {
                    clearTimeout(timeout);
                    console.error('Ошибка Telegram:', e.message);
                    return false;
                }
            }

            function renderQuiz() {
                const questions = getQuestionsForAction(state.currentAction);
                const totalSteps = questions.length + 1;
                
                if (state.currentStep < questions.length) {
                    const q = questions[state.currentStep];
                    const progress = (state.currentStep / totalSteps) * 100;
                    
                    let html = `<div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>`;
                    html += `<h3 style="margin-bottom:1rem;">${escapeHtml(q.text)}</h3>`;
                    
                    q.options.forEach(opt => {
                        const sel = state.answers[state.currentStep] === opt ? ' selected' : '';
                        html += `<div class="quiz-option${sel}" data-value="${escapeHtml(opt)}">${escapeHtml(opt)}</div>`;
                    });
                    
                    html += `<button class="btn" id="nextBtn">Далее →</button>`;
                    DOM.quizContent.innerHTML = html;
                    
                    document.querySelectorAll('.quiz-option').forEach(opt => {
                        opt.addEventListener('click', () => {
                            document.querySelectorAll('.quiz-option').forEach(o => o.classList.remove('selected'));
                            opt.classList.add('selected');
                            state.answers[state.currentStep] = opt.dataset.value;
                        });
                    });
                    
                    document.getElementById('nextBtn').addEventListener('click', () => {
                        if (!state.answers[state.currentStep]) {
                            showGlobalError('Пожалуйста, выберите вариант ответа');
                            return;
                        }
                        state.currentStep++;
                        renderQuiz();
                    });
                } else {
                    renderContactForm();
                }
            }

            function renderContactForm() {
                const estimate = getEstimate();
                
                DOM.quizContent.innerHTML = `
                    <div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
                    <h3>📞 Остался последний шаг!</h3>
                    <p style="margin-bottom:0.8rem;">Предварительная оценка: <strong>${escapeHtml(estimate)}</strong></p>
                    <div>
                        <input type="text" class="input-field" id="nameInput" placeholder="👤 Ваше имя" autocomplete="name" maxlength="50">
                        <div class="error-message" id="nameError"></div>
                    </div>
                    <div>
                        <input type="tel" class="input-phone" id="phoneInput" placeholder="📞 +7 (___) ___-__-__" autocomplete="tel">
                        <div class="error-message" id="phoneError"></div>
                    </div>
                    <button class="btn btn-success" id="submitBtn"><span class="btn-text">📨 Отправить заявку</span></button>
                `;
                
                const nameInput = document.getElementById('nameInput');
                const phoneInput = document.getElementById('phoneInput');
                const submitBtn = document.getElementById('submitBtn');
                
                phoneInput.addEventListener('input', function() {
                    let value = this.value.replace(/\D/g, '').substring(0, 11);
                    let formatted = '+7';
                    if (value.length > 1) formatted += ' (' + value.substring(1, 4);
                    if (value.length >= 5) formatted += ') ' + value.substring(4, 7);
                    if (value.length >= 8) formatted += '-' + value.substring(7, 9);
                    if (value.length >= 10) formatted += '-' + value.substring(9, 11);
                    this.value = formatted;
                    clearFieldError(phoneInput);
                });
                
                nameInput.addEventListener('input', () => clearFieldError(nameInput));
                
                submitBtn.addEventListener('click', async () => {
                    if (state.isSubmitting) return;
                    
                    clearFieldError(nameInput);
                    clearFieldError(phoneInput);
                    
                    const now = Date.now();
                    if (now - lastSubmitTime < RATE_LIMIT_MS) {
                        const wait = Math.ceil((RATE_LIMIT_MS - (now - lastSubmitTime)) / 1000);
                        showGlobalError(`⏳ Подождите ${wait} сек. перед повторной отправкой`);
                        return;
                    }
                    
                    let hasErrors = false;
                    const clientName = nameInput.value.trim();
                    
                    if (!validateName(clientName)) {
                        showFieldError(nameInput, 'Имя должно содержать от 2 до 50 символов');
                        nameInput.focus();
                        hasErrors = true;
                    }
                    
                    if (!validatePhone(phoneInput.value)) {
                        showFieldError(phoneInput, 'Введите корректный номер телефона (+7...)');
                        if (!hasErrors) phoneInput.focus();
                        hasErrors = true;
                    }
                    
                    if (hasErrors) return;
                    
                    state.isSubmitting = true;
                    submitBtn.disabled = true;
                    submitBtn.classList.add('btn-loading');
                    
                    state.clientName = sanitizeString(clientName);
                    state.phoneNumber = phoneInput.value;
                    lastSubmitTime = Date.now();
                    
                    const lead = {
                        city: state.currentCity,
                        action: state.currentAction,
                        name: state.clientName,
                        phone: state.phoneNumber,
                        details: state.answers.map(a => sanitizeString(a))
                    };
                    
                    const success = await sendToTelegram(lead);
                    
                    if (success) {
                        showSuccessScreen();
                    } else {
                        state.isSubmitting = false;
                        submitBtn.disabled = false;
                        submitBtn.classList.remove('btn-loading');
                        showGlobalError('❌ Ошибка отправки. Попробуйте ещё раз.');
                    }
                });
                
                phoneInput.addEventListener('keypress', e => {
                    if (e.key === 'Enter' && !state.isSubmitting) submitBtn.click();
                });
            }

            function showSuccessScreen() {
                const cityName = state.currentCity === 'novorossiysk' ? 'Новороссийск' : 'Геленджик';
                const actionText = { sell:'ПРОДАЖА', buy:'ПОКУПКА', rent_out:'СДАЧА', rent_in:'АРЕНДА' }[state.currentAction];
                
                DOM.quizContent.innerHTML = `
                    <div class="text-center">
                        <h2>✅ Спасибо за заявку!</h2>
                        <p style="margin:1rem 0;">Мы свяжемся с вами в ближайшее время.</p>
                        <div class="bonus">🎁 Специалист подберёт для вас лучшие варианты</div>
                        <div class="data-output">
                            <strong>Ваши данные:</strong><br>
                            Город: ${escapeHtml(cityName)}<br>
                            Тип: ${escapeHtml(actionText)}<br>
                            Имя: ${escapeHtml(state.clientName)}<br>
                            Телефон: ${escapeHtml(state.phoneNumber)}
                        </div>
                        <button class="btn btn-outline" id="resetBtn">🔄 Новый запрос</button>
                    </div>
                `;
                document.getElementById('resetBtn').addEventListener('click', resetApp);
            }

            function resetApp() {
                state.currentStep = 0; state.answers = []; state.clientName = ''; state.phoneNumber = '';
                state.isSubmitting = false; state.currentAction = null; state.currentCity = null;
                DOM.step2.style.display = 'none'; DOM.step1.style.display = 'block';
                DOM.cityNovoros.classList.remove('active'); DOM.cityGelendzhik.classList.remove('active');
                DOM.currentCityBadge.textContent = '🏙️ Выберите город';
                DOM.currentCityBadge.style.background = '#f9a826';
                DOM.btnSell.disabled = DOM.btnBuy.disabled = DOM.btnRentOut.disabled = DOM.btnRentIn.disabled = true;
                DOM.globalError.style.display = 'none';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function selectCity(city) {
                state.currentCity = city;
                DOM.cityNovoros.classList.toggle('active', city === 'novorossiysk');
                DOM.cityGelendzhik.classList.toggle('active', city === 'gelendzhik');
                DOM.currentCityBadge.textContent = city === 'novorossiysk' ? '🌊 Новороссийск' : '🏖️ Геленджик';
                DOM.currentCityBadge.style.background = city === 'novorossiysk' ? '#1e7a9c' : '#f9a826';
                DOM.btnSell.disabled = DOM.btnBuy.disabled = DOM.btnRentOut.disabled = DOM.btnRentIn.disabled = false;
            }

            function startQuiz(action) {
                if (!state.currentCity) { showGlobalError('Пожалуйста, сначала выберите город'); return; }
                state.currentAction = action; state.currentStep = 0; state.answers = [];
                state.clientName = ''; state.phoneNumber = ''; state.isSubmitting = false;
                DOM.step1.style.display = 'none'; DOM.step2.style.display = 'block';
                DOM.globalError.style.display = 'none';
                renderQuiz();
                DOM.step2.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            function init() {
                DOM.cityNovoros.addEventListener('click', () => selectCity('novorossiysk'));
                DOM.cityGelendzhik.addEventListener('click', () => selectCity('gelendzhik'));
                DOM.btnSell.addEventListener('click', () => startQuiz('sell'));
                DOM.btnBuy.addEventListener('click', () => startQuiz('buy'));
                DOM.btnRentOut.addEventListener('click', () => startQuiz('rent_out'));
                DOM.btnRentIn.addEventListener('click', () => startQuiz('rent_in'));
            }
            
            document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', init) : init();
        })();
    </script>
</body>
</html>
